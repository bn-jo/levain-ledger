<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Sourdough workbench: baker's percentage calculator, saved recipes, levain builder, water temperature, bake schedule and troubleshooting. English and Hebrew.">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Levain Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600&family=Heebo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#EEF0EA; --surface:#FBFCF8; --sunk:#E4E7DF; --ink:#1B201C; --muted:#5C655D; --line:#D3D8CD;
  --accent:#27477A; --accent-soft:#DCE4F1; --on-accent:#FFFFFF;
  --bread:#D8B467; --ww:#9A6232; --rye:#5A4535; --spelt:#B9925A; --water:#7FA6CF; --salt:#A9AFA6; --seed:#6E8B4E;
  --good:#2F7A4B; --warn:#A8640F; --bad:#B23A2E; --warn-soft:#F6E8D2; --bad-soft:#F5DCD8;
  --display:"Bricolage Grotesque", "Heebo", "Segoe UI", system-ui, sans-serif;
  --body:"Figtree", "Heebo", "Segoe UI", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Consolas, monospace;
}
:root[lang="he"]{
  --display:"Heebo", "Segoe UI", system-ui, sans-serif;
  --body:"Heebo", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#111412; --surface:#191D1A; --sunk:#0D0F0E; --ink:#E7EAE3; --muted:#99A299; --line:#2C322D;
    --accent:#93B3E3; --accent-soft:#1E2B40; --on-accent:#0F1724;
    --bread:#E0C07A; --ww:#C98C55; --rye:#A88A70; --spelt:#CFAE79; --water:#7FA6CF; --salt:#7D847B; --seed:#93B06F;
    --good:#6CC28E; --warn:#E3A552; --bad:#EC8577; --warn-soft:#33281A; --bad-soft:#3A201C;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#111412; --surface:#191D1A; --sunk:#0D0F0E; --ink:#E7EAE3; --muted:#99A299; --line:#2C322D;
  --accent:#93B3E3; --accent-soft:#1E2B40; --on-accent:#0F1724;
  --bread:#E0C07A; --ww:#C98C55; --rye:#A88A70; --spelt:#CFAE79; --water:#7FA6CF; --salt:#7D847B; --seed:#93B06F;
  --good:#6CC28E; --warn:#E3A552; --bad:#EC8577; --warn-soft:#33281A; --bad-soft:#3A201C;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--body);padding-inline:16px;padding-block:20px 48px}
.app{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15}
h2{font-size:1.45rem;font-weight:700}
h3{font-size:1.05rem;font-weight:700}
p{margin:0}
.num,td.n,th.n{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.acc{color:var(--accent)}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:44px;height:44px;flex:none}
.brand h1{font-size:1.75rem;font-weight:800;letter-spacing:-.02em}
.brand p{color:var(--muted);font-size:.9rem}
.toggles{display:flex;gap:8px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--sunk);border-radius:10px;padding:3px;gap:2px;position:relative}
.seg button,.seg label{border:0;background:transparent;color:var(--muted);font:600 .85rem var(--body);padding:6px 12px;border-radius:8px;cursor:pointer}
.seg button[aria-pressed="true"],.seg input:checked+label{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0/.12)}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg button[data-lang="he"]{font-family:"Heebo",var(--body)}

/* tabs */
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:none}
.tabs button{flex:none;border:0;background:none;color:var(--muted);font:600 .95rem var(--body);padding:10px 14px;border-bottom:3px solid transparent;cursor:pointer;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabs button:hover{color:var(--ink)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible,tr:focus-visible,label:focus-within{outline:2px solid var(--accent);outline-offset:2px}

.panel{display:flex;flex-direction:column;gap:20px}
.lede{max-width:68ch;color:var(--muted)}
.grid2{display:grid;grid-template-columns:minmax(0,360px) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:860px){.grid2{grid-template-columns:minmax(0,1fr)}}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.stack{display:flex;flex-direction:column;gap:16px}
fieldset{border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:10px}
legend{font:700 .74rem var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:0;margin-bottom:8px}
:root[lang="he"] legend,:root[lang="he"] th,:root[lang="he"] .stat span,:root[lang="he"] .label{letter-spacing:0}
.inputs{display:flex;flex-direction:column;gap:18px}
.inputs hr{border:0;border-top:1px solid var(--line);margin:0}
.row{display:grid;grid-template-columns:minmax(0,1fr) 120px;align-items:center;gap:10px}
.row.wide{grid-template-columns:minmax(0,1fr) 170px}
.row label{font-size:.92rem}
.row label small{display:block;color:var(--muted);font-size:.78rem;line-height:1.3}
.field{position:relative;display:flex;align-items:center}
.field input,.field select,select.full{width:100%;font:500 .95rem var(--mono);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
.field select,select.full{font-family:var(--body)}
.field input[data-suffix]{padding-inline-end:38px}
.field .sfx{position:absolute;inset-inline-end:10px;color:var(--muted);font:.82rem var(--mono);pointer-events:none}
:root[lang="he"] .field .sfx{font-family:var(--body)}
.field input[readonly]{background:var(--sunk);color:var(--muted)}
input.plain,textarea.plain{width:100%;font:500 .95rem var(--body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
textarea.plain{resize:vertical;min-height:64px;font-weight:400}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 .84rem var(--body);padding:6px 12px;border-radius:999px;cursor:pointer}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}

/* formula sheet */
.sheet-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.stat{background:var(--surface);padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.stat span{font:700 .7rem var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.stat b{font:500 1.35rem var(--mono);font-variant-numeric:tabular-nums}
@media (max-width:560px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.95rem}
th{font:700 .72rem var(--body);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);text-align:start;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:9px 10px;border-bottom:1px solid var(--line)}
th.n,td.n{text-align:end;white-space:nowrap}
tr.sub td{color:var(--muted);font-size:.86rem;padding-top:4px;padding-bottom:4px}
tr.sub td:first-child{padding-inline-start:28px}
tr.total td{font-weight:600;border-bottom:0;border-top:2px solid var(--ink)}
td.mix{font-weight:600;color:var(--accent)}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:8px;vertical-align:baseline}
.bar{display:flex;height:16px;border-radius:6px;overflow:hidden;margin-top:16px;background:var(--sunk)}
.bar div{height:100%;transition:width .25s}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:.8rem;color:var(--muted)}
.notes{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.note{font-size:.88rem;padding:9px 12px;border-radius:8px;background:var(--sunk)}
.note.warn{background:var(--warn-soft);color:var(--ink);border-inline-start:3px solid var(--warn)}
.note.bad{background:var(--bad-soft);color:var(--ink);border-inline-start:3px solid var(--bad)}
.note b{font-weight:600}

.btn{border:0;background:var(--accent);color:var(--on-accent);font:600 .9rem var(--body);padding:9px 14px;border-radius:9px;cursor:pointer}
.btn:disabled{opacity:.6;cursor:default}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
.btn.small{font-size:.82rem;padding:6px 10px}
.btn.danger{background:var(--bad);color:var(--surface)}
.analyze-out{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.analyze-out div{background:var(--sunk);border-radius:10px;padding:10px 12px}
.analyze-out span{display:block;font:700 .68rem var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.analyze-out b{font:500 1.15rem var(--mono)}

/* saved recipes */
.recipes{display:flex;flex-direction:column}
.recipe{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.recipe .nm{font-weight:600;overflow-wrap:anywhere}
.recipe .meta{font-size:.8rem;color:var(--muted)}
.recipe .meta bdi{font-family:var(--mono)}
.recipe .notes-txt{grid-column:1/-1;font-size:.86rem;color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere}
.recipe .acts{display:flex;gap:6px}
.status{font-size:.86rem;color:var(--muted);min-height:1.2em}
.status.ok{color:var(--good)}
.status.err{color:var(--bad)}
.store-note{font-size:.78rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.store-note i{width:8px;height:8px;border-radius:50%;background:var(--salt);flex:none}
.store-note.cloud i{background:var(--good)}

/* big answer */
.answer{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.answer .big{font:700 3.4rem/1 var(--display);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.answer .label{font:700 .74rem var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.thermo-wrap{width:100%;direction:ltr}
.thermo{width:100%;height:10px;border-radius:999px;background:linear-gradient(90deg,#5B8FD0,#8CC1A0 45%,#E2B653 70%,#D1553F);position:relative;margin-top:10px}
.thermo i{position:absolute;top:-5px;width:4px;height:20px;border-radius:2px;background:var(--ink);transform:translateX(-2px);transition:left .25s}
.thermo-scale{display:flex;justify-content:space-between;font:.75rem var(--mono);color:var(--muted);margin-top:6px;width:100%}

/* recipe parts */
.parts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.parts div{border:1px solid var(--line);border-radius:10px;padding:12px}
.parts span{display:block;font-size:.8rem;color:var(--muted)}
.parts b{font:500 1.5rem var(--mono)}
@media (max-width:420px){.parts b{font-size:1.15rem}}
tr.pick{cursor:pointer}
tr.pick:hover td{background:var(--sunk)}
tr.pick.on td{background:var(--accent-soft)}

/* timeline */
.timeline{display:flex;flex-direction:column}
.day{font:700 .74rem var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--accent);padding:14px 0 6px;border-bottom:1px solid var(--line)}
:root[lang="he"] .day{letter-spacing:0;font-size:.85rem}
.step{display:grid;grid-template-columns:72px 18px minmax(0,1fr);gap:10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:start}
.step time{font:500 1rem var(--mono);font-variant-numeric:tabular-nums;padding-top:1px}
.step .dot{width:12px;height:12px;border-radius:50%;margin-top:6px;border:2px solid var(--accent);background:var(--surface)}
.step.key .dot{background:var(--accent)}
.step.minor{padding:6px 0}
.step.minor time,.step.minor .t{color:var(--muted);font-size:.9rem}
.step.minor .dot{width:8px;height:8px;margin:7px 2px 0;border-color:var(--muted)}
.step .t{font-weight:600}
.step .d{color:var(--muted);font-size:.88rem}
.pill{display:inline-block;font:600 .72rem var(--body);padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);margin-inline-start:6px;vertical-align:1px}

/* fix-it */
.issues{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:760px){.issues{grid-template-columns:minmax(0,1fr)}}
details.issue{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0}
details.issue summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
details.issue summary::-webkit-details-marker{display:none}
details.issue summary h3{font-size:1rem}
details.issue summary .tag{font:600 .7rem var(--body);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);flex:none}
details.issue .body{padding:0 16px 16px;display:flex;flex-direction:column;gap:10px;font-size:.92rem}
details.issue .body h4{font:700 .72rem var(--body);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0}
details.issue ul{margin:0;padding-inline-start:18px;display:flex;flex-direction:column;gap:4px}
details.issue[open]{border-color:var(--accent)}

/* guide */
.guide{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:860px){.guide{grid-template-columns:minmax(0,1fr)}}
ol.process{margin:0;padding:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:14px}
ol.process li{counter-increment:s;display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px}
ol.process li::before{content:counter(s);font:700 .9rem var(--mono);color:var(--accent);background:var(--accent-soft);border-radius:8px;height:28px;display:grid;place-items:center}
ol.process b{display:block}
ol.process p{color:var(--muted);font-size:.9rem}
.signs{margin:0;padding-inline-start:18px;display:flex;flex-direction:column;gap:6px;font-size:.92rem}
footer{color:var(--muted);font-size:.8rem;max-width:70ch}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 48 48" aria-hidden="true">
        <ellipse cx="24" cy="28" rx="20" ry="13" fill="var(--bread)"/>
        <path d="M8 27c3-9 10-14 16-14s13 5 16 14" fill="none" stroke="var(--ww)" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M16 22c5-4 11-5 18-1" fill="none" stroke="var(--surface)" stroke-width="2.5" stroke-linecap="round"/>
      </svg>
      <div>
        <h1>Levain Ledger</h1>
        <p data-i18n="appSub"></p>
      </div>
    </div>
    <div class="toggles">
      <div class="seg" role="group" aria-label="Language">
        <button type="button" data-lang="en" aria-pressed="true">EN</button>
        <button type="button" data-lang="he" aria-pressed="false">עברית</button>
      </div>
      <div class="seg" role="group" aria-label="Temperature unit">
        <button type="button" data-unit="C" aria-pressed="true">°C</button>
        <button type="button" data-unit="F" aria-pressed="false">°F</button>
      </div>
    </div>
  </header>

  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="formula" aria-selected="true" data-i18n="tFormula"></button>
    <button role="tab" data-tab="recipes" aria-selected="false" data-i18n="tRecipes"></button>
    <button role="tab" data-tab="levain" aria-selected="false" data-i18n="tLevain"></button>
    <button role="tab" data-tab="water" aria-selected="false" data-i18n="tWater"></button>
    <button role="tab" data-tab="schedule" aria-selected="false" data-i18n="tSchedule"></button>
    <button role="tab" data-tab="fix" aria-selected="false" data-i18n="tFix"></button>
    <button role="tab" data-tab="guide" aria-selected="false" data-i18n="tGuide"></button>
  </nav>

  <main>
  <!-- FORMULA -->
  <section class="panel" id="tab-formula" role="tabpanel">
    <div class="stack" style="gap:10px">
      <p class="lede" data-i18n="fLede"></p>
      <div class="chips" id="presets"></div>
    </div>
    <div class="grid2">
      <div class="stack">
      <div class="card inputs">
        <fieldset>
          <legend data-i18n="lgBatch"></legend>
          <div class="seg" role="radiogroup">
            <input type="radio" name="mode" id="modeDough" value="dough" checked><label for="modeDough" data-i18n="modeDough"></label>
            <input type="radio" name="mode" id="modeFlour" value="flour"><label for="modeFlour" data-i18n="modeFlour"></label>
          </div>
          <div id="doughModeFields" class="stack" style="gap:10px">
            <div class="row"><label for="loaves"><span data-i18n="lLoaves"></span></label><div class="field"><input id="loaves" type="number" inputmode="decimal" min="1" step="1" value="2"></div></div>
            <div class="row"><label for="loafWeight"><span data-i18n="lLoafW"></span><small data-i18n="sLoafW"></small></label><div class="field"><input id="loafWeight" type="number" inputmode="decimal" min="50" step="10" value="900" data-suffix><span class="sfx" data-i18n="g"></span></div></div>
          </div>
          <div id="flourModeFields" class="row" hidden><label for="flourTotal"><span data-i18n="lFlourTotal"></span><small data-i18n="sFlourTotal"></small></label><div class="field"><input id="flourTotal" type="number" inputmode="decimal" min="50" step="10" value="1000" data-suffix><span class="sfx" data-i18n="g"></span></div></div>
        </fieldset>
        <hr>
        <fieldset>
          <legend data-i18n="lgHyd"></legend>
          <div class="row"><label for="hyd"><span data-i18n="lHyd"></span><small id="hydHint"></small></label><div class="field"><input id="hyd" type="number" inputmode="decimal" min="40" max="120" step="1" value="75" data-suffix><span class="sfx">%</span></div></div>
          <div class="row"><label for="salt"><span data-i18n="lSalt"></span><small data-i18n="sSalt"></small></label><div class="field"><input id="salt" type="number" inputmode="decimal" min="0" max="5" step="0.1" value="2" data-suffix><span class="sfx">%</span></div></div>
        </fieldset>
        <hr>
        <fieldset>
          <legend data-i18n="lgLev"></legend>
          <div class="row"><label for="lev"><span data-i18n="lLev"></span><small data-i18n="sLev"></small></label><div class="field"><input id="lev" type="number" inputmode="decimal" min="1" max="60" step="1" value="20" data-suffix><span class="sfx">%</span></div></div>
          <div class="row"><label for="levHyd"><span data-i18n="lLevHyd"></span><small data-i18n="sLevHyd"></small></label><div class="field"><input id="levHyd" type="number" inputmode="decimal" min="40" max="200" step="5" value="100" data-suffix><span class="sfx">%</span></div></div>
          <div class="row"><label for="levFlour"><span data-i18n="lLevFlour"></span></label><div class="field"><select id="levFlour">
            <option value="bread" data-i18n="fl_bread"></option><option value="ww" data-i18n="fl_ww"></option><option value="rye" data-i18n="fl_rye"></option><option value="spelt" data-i18n="fl_spelt"></option>
          </select></div></div>
        </fieldset>
        <hr>
        <fieldset>
          <legend data-i18n="lgBlend"></legend>
          <div class="row"><label for="ww"><span data-i18n="fl_ww"></span></label><div class="field"><input id="ww" type="number" inputmode="decimal" min="0" max="100" step="5" value="10" data-suffix><span class="sfx">%</span></div></div>
          <div class="row"><label for="rye"><span data-i18n="fl_rye"></span></label><div class="field"><input id="rye" type="number" inputmode="decimal" min="0" max="100" step="5" value="0" data-suffix><span class="sfx">%</span></div></div>
          <div class="row"><label for="spelt"><span data-i18n="fl_spelt"></span></label><div class="field"><input id="spelt" type="number" inputmode="decimal" min="0" max="100" step="5" value="0" data-suffix><span class="sfx">%</span></div></div>
          <div class="row"><label for="breadPct"><span data-i18n="fl_bread"></span><small data-i18n="sBread"></small></label><div class="field"><input id="breadPct" type="number" readonly tabindex="-1" value="90" data-suffix><span class="sfx">%</span></div></div>
        </fieldset>
        <hr>
        <fieldset>
          <legend data-i18n="lgInc"></legend>

function peakHours(a, b, c, tC){
  const feed = (b + c) / Math.max(a, 0.01);
  return clamp(2.8 * Math.sqrt(feed) * Math.pow(0.92, tC - 24), 1.5, 30);
}
function renderLevain(){
  $('levNeed').value = Math.round(F.L);
  const total = F.L + num('levKeep');
  const a = num('rS'), b = num('rF'), c = num('rW');
  const p = total / (a + b + c || 1);
  $('levTotal').textContent = grams(total);
  $('pS').textContent = grams(a * p); $('pF').textContent = grams(b * p); $('pW').textContent = grams(c * p);
  const bh = (c + a / 2) / (b + a / 2) * 100;
  let hn = t('buildHyd', { h: Math.round(bh) });
  if (Math.abs(bh - F.lh * 100) > 15) hn += t('buildHydExp', { h: Math.round(F.lh * 100) });
  $('levHydNote').textContent = hn;
  const tC = toC(num('levTemp'));
  const hrs = peakHours(a, b, c, tC);
  const [fh, fm] = ($('levFeedAt').value || '21:00').split(':').map(Number);
  const startMin = fh * 60 + fm, endMin = startMin + hrs * 60;
  const hm = d => { const m = ((Math.round(d) % 1440) + 1440) % 1440; return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'); };
  $('levReady').textContent = hm(endMin);
  $('levReadyNote').textContent = t('peakNote', { d: fmtDur(hrs), nd: endMin >= 1440 ? t('nextDay') : '', t: hm(endMin - 60) });
  $('ratioTitle').textContent = t('ratiosAt', { t: fmtT(tC) });
  const ratios = [[1, 1, 1], [1, 2, 2], [1, 3, 3], [1, 5, 5], [1, 10, 10]];
  $('ratioTable').innerHTML = ratios.map(r => {
    const q = total / (r[0] + r[1] + r[2]);
    const on = r[0] === a && r[1] === b && r[2] === c ? ' on' : '';
    return `<tr class="pick${on}" tabindex="0" data-r="${r.join(',')}"><td class="num"><bdi>${r.join(':')}</bdi></td><td class="n">${grams(q * r[0])}</td><td class="n">${grams(q * r[1])}</td><td class="n">${grams(q * r[2])}</td><td class="n">${fmtDur(peakHours(r[0], r[1], r[2], tC))}</td></tr>`;
  }).join('');
}
$('ratioTable').addEventListener('click', e => applyRatio(e.target.closest('tr')));
$('ratioTable').addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); applyRatio(e.target.closest('tr')); } });
function applyRatio(tr){

  const [a, b, c] = tr.dataset.r.split(',');
  $('rS').value = a; $('rF').value = b; $('rW').value = c;
  recalc(); save();
}

/* ================= schedule ================= */
const RISE_T = [18, 20, 22, 24, 26, 28], RISE_P = [100, 85, 70, 50, 40, 30];
function targetRise(tC){
  if (tC <= RISE_T[0]) return RISE_P[0];
  for (let i = 1; i < RISE_T.length; i++) if (tC <= RISE_T[i]) {
    const f = (tC - RISE_T[i - 1]) / (RISE_T[i] - RISE_T[i - 1]);
    return RISE_P[i - 1] + f * (RISE_P[i] - RISE_P[i - 1]);
  }
  return RISE_P[RISE_P.length - 1];
}
function bulkEstimate(tC){
  const lev = Math.max(F.l, 0.02);
  return clamp(5 * Math.pow(0.92, tC - 24) * Math.pow(0.2 / lev, 0.35) * (1 - 0.15 * F.wholeFrac), 2, 16);
}
function toLocalInput(d){ const p = n => String(n).padStart(2, '0'); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`; }
function defaultSchedTime(){ const d = new Date(); d.setDate(d.getDate() + 1); d.setHours(9, 0, 0, 0); return toLocalInput(d); }
function renderSchedule(){
  if (!$('schAt').value) $('schAt').value = defaultSchedTime();
  const tC = toC(num('schTemp'));
  const est = bulkEstimate(tC);
  $('bulkAuto').textContent = t('bulkEst', { d: fmtDur(est) });
  const bulkH = $('schBulk').value ? clamp(num('schBulk'), 0.5, 24) : est;
  const auto = parseFloat($('schAutolyse').value) || 0;
  const folds = Math.round(clamp(num('schFolds'), 0, 8)), gap = clamp(num('schFoldGap'), 5, 120);
  const retard = clamp(num('schRetard'), 0, 72), cool = clamp(num('schCool'), 0, 600);
  const levH = peakHours(num('rS'), num('rF'), num('rW'), toC(num('levTemp')));
  const rise = Math.round(targetRise(tC) / 5) * 5;

  const steps = [];
  const bulkStart = auto;
  steps.push({ m: bulkStart - levH * 60, t: t('sFeed', { r: `<bdi>${num('rS')}:${num('rF')}:${num('rW')}</bdi>` }), d: t('sFeedD', { g: grams(F.L + num('levKeep')), t: fmtT(toC(num('levTemp'))), d: fmtDur(levH) }), key: true });
  if (auto > 0) {
    steps.push({ m: 0, t: t('sAuto'), d: t('sAutoD', { f: grams(F.flours.reduce((a, f) => a + Math.max(f.mix, 0), 0)), w: grams(Math.max(F.mixWater * 0.94, 0)) }), key: true });
    steps.push({ m: auto, t: t('sAddLev'), d: t('sAddLevD', { l: grams(F.L), s: grams(F.S), t: fmtT(tC) }), key: true });
  } else {
    steps.push({ m: 0, t: t('sMixAll'), d: t('sMixAllD', { t: fmtT(tC) }), key: true });
  }
  for (let i = 1; i <= folds; i++) {
    steps.push({ m: bulkStart + i * gap, t: t('sFold', { i, n: folds }), d: i === 1 && F.I > 0 ? t('sFoldInc', { x: escapeHtml(incLabel()) }) : (i === folds ? t('sFoldLast') : ''), minor: true });
  }
  const bulkEnd = bulkStart + bulkH * 60;
  steps.push({ m: bulkEnd, t: `${t('sBulkEnd')} <span class="pill">${t('risePill', { p: rise })}</span>`, d: t('sBulkEndD', { d: fmtDur(bulkH), t: fmtT(tC) }), key: true });
  const shape = bulkEnd + 30;
  steps.push({ m: shape, t: t('sShape'), d: t('sShapeD'), key: true });
  let bake;
  if (retard > 0) {
    steps.push({ m: shape + 15, t: t('sFridge'), d: t('sFridgeD', { h: retard }), minor: true });
    bake = shape + 15 + retard * 60;
  } else {
    const proofH = clamp(bulkH * 0.35, 1, 4);
    steps.push({ m: shape, t: t('sRoomProof'), d: t('sRoomProofD', { d: fmtDur(proofH) }), minor: true });
    bake = shape + proofH * 60;
  }
  steps.push({ m: bake - 60, t: t('sPreheat'), d: t('sPreheatD', { t: fmtT(250) }), minor: true });
  steps.push({ m: bake, t: t('sBake'), d: t('sBakeD', { t: fmtT(250) }), key: true });
  steps.push({ m: bake + 20, t: t('sLidOff'), d: t('sLidOffD', { t: fmtT(230), a: fmtT(96), b: fmtT(98) }), minor: true });
  steps.push({ m: bake + 45, t: t('sOut'), d: t('sOutD'), key: true });
  steps.push({ m: bake + 45 + cool, t: t('sSlice'), d: '', key: true });

  const anchor = new Date($('schAt').value);
  if (isNaN(anchor)) { $('timeline').innerHTML = `<p class="muted">${t('pickDate')}</p>`; return; }
  const mixAt = $('anchorReady').checked ? new Date(anchor.getTime() - (bake + 45 + cool) * 60000) : anchor;
  steps.sort((a, b) => a.m - b.m);
  const today = new Date(); today.setHours(0, 0, 0, 0);
  let lastDay = '', html = '';
  steps.forEach(s => {
    const d = new Date(mixAt.getTime() + s.m * 60000);
    const day0 = new Date(d); day0.setHours(0, 0, 0, 0);
    const diff = Math.round((day0 - today) / 86400000);
    const rel = diff === 0 ? t('dayToday') : diff === 1 ? t('dayTomorrow') : diff === -1 ? t('dayYesterday') : '';
    const dayLbl = (rel ? rel + ' · ' : '') + d.toLocaleDateString(loc(), { weekday: 'long', month: 'short', day: 'numeric' });
    if (dayLbl !== lastDay) { html += `<div class="day">${dayLbl}</div>`; lastDay = dayLbl; }
    const tm = d.toLocaleTimeString(loc(), { hour: '2-digit', minute: '2-digit' });
    html += `<div class="step ${s.key ? 'key' : ''} ${s.minor ? 'minor' : ''}"><time>${tm}</time><span class="dot"></span><div><div class="t">${s.t}</div>${s.d ? `<div class="d">${s.d}</div>` : ''}</div></div>`;
  });
  $('timeline').innerHTML = html;
  $('schSummary').textContent = t('tlSummary', { d: fmtDur((bake + 45 + cool - steps[0].m) / 60) });
}

  $('issues').innerHTML = t('issues').filter(i => fixFilter === 'All' || i[0] === fixFilter).map(i => `
    <details class="issue"><summary><h3>${escapeHtml(i[1])}</h3><span class="tag">${cats[i[0]]}</span></summary>
      <div class="body"><h4>${t('causesH')}</h4><ul>${i[2].map(x => `<li>${escapeHtml(x)}</li>`).join('')}</ul>
      <h4>${t('fixH')}</h4><ul>${i[3].map(x => `<li>${escapeHtml(x)}</li>`).join('')}</ul></div></details>`).join('');
}
$('fixFilters').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  fixFilter = b.dataset.c; renderFix();
});

/* ================= guide ================= */
function renderGuide(){
  $('process').innerHTML = t('process').map(p => `<li><div><b>${p[0]}</b><p>${p[1].replace('{hot}', fmtT(250)).replace('{mid}', fmtT(230))}</p></div></li>`).join('');
  $('hydTable').innerHTML = t('hydRows').map(r => `<tr><td>${r[0]}</td><td class="n">${r[1]}</td><td class="small muted">${r[2]}</td></tr>`).join('');
}

/* ================= language ================= */
function applyStatic(){
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'he' ? 'rtl' : 'ltr';
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-html]').forEach(el => { el.innerHTML = t(el.dataset.i18nHtml); });
  document.querySelectorAll('[data-i18n-ph]').forEach(el => { el.placeholder = t(el.dataset.i18nPh); });
  document.querySelectorAll('[data-i18n-list]').forEach(el => { el.innerHTML = t(el.dataset.i18nList).map(x => `<li>${x}</li>`).join(''); });
  document.querySelectorAll('[data-lang]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
  renderPresets();
}
function setLang(l){
  if (!STR[l]) return;
  // swap the preset seed name if it is still the default text
  const inc = $('incName');
  if (inc.value === STR[lang].seedMix) inc.value = STR[l].seedMix;
  lang = l;
  applyStatic(); recalc(); renderRecipes();
}
document.querySelectorAll('[data-lang]').forEach(b => b.addEventListener('click', () => { setLang(b.dataset.lang); save(); }));

/* ================= glue ================= */
function recalc(){
  calcFormula(); renderFormula(); renderAnalyze(); renderLevain(); renderWater(); renderSchedule(); renderFix(); renderGuide();
}
function save(){
  try {
    const values = {};
    document.querySelectorAll('main input[id], main select[id], main textarea[id]').forEach(el => {
      values[el.id] = (el.type === 'radio' || el.type === 'checkbox') ? el.checked : el.value;
    });
    localStorage.setItem(STORE, JSON.stringify({ values, unit, lang }));
  } catch (e) {}
}
function load(){
  try {
    const raw = localStorage.getItem(STORE); if (!raw) return false;
    const s = JSON.parse(raw);
    if (s.unit === 'F') setUnit('F', false);
    if (s.lang && STR[s.lang]) lang = s.lang;
    Object.entries(s.values || {}).forEach(([id, v]) => {
      const el = $(id); if (!el || el.readOnly) return;
      if (el.type === 'radio' || el.type === 'checkbox') el.checked = !!v; else el.value = v;
    });
    return true;
  } catch (e) { return false; }
}
function setUnit(u, convert = true){
  if (u === unit) return;
  if (convert) document.querySelectorAll('input.temp').forEach(el => {
    const v = parseFloat(el.value); if (!isFinite(v)) return;
    el.value = Math.round((u === 'F' ? v * 9 / 5 + 32 : (v - 32) * 5 / 9) * 2) / 2;
  });
  unit = u;
  document.querySelectorAll('.tsfx').forEach(el => el.textContent = '°' + u);
  document.querySelectorAll('[data-unit]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.unit === u)));
}
document.querySelectorAll('[data-unit]').forEach(b => b.addEventListener('click', () => { setUnit(b.dataset.unit); recalc(); save(); }));

const FORMULA_IDS = ['hyd', 'salt', 'lev', 'levHyd', 'ww', 'rye', 'spelt', 'inc', 'incName'];
document.querySelector('main').addEventListener('input', e => {
  if (e.target.id === 'rName' || e.target.id === 'rNotes') { save(); return; }
  if (FORMULA_IDS.includes(e.target.id)) markPreset(-1);
  recalc(); save();
});
document.querySelector('main').addEventListener('change', e => {
  if (e.target.id === 'rName' || e.target.id === 'rNotes') return;
  recalc(); save();
});

const tabs = [...document.querySelectorAll('[role="tab"]')];
function showTab(name){
  if (!$('tab-' + name)) name = 'formula';
  tabs.forEach(tb => tb.setAttribute('aria-selected', String(tb.dataset.tab === name)));
  document.querySelectorAll('[role="tabpanel"]').forEach(p => p.hidden = p.id !== 'tab-' + name);
  try { sessionStorage.setItem(STORE + '-tab', name); } catch (e) {}
}
tabs.forEach(tb => tb.addEventListener('click', () => showTab(tb.dataset.tab)));

const restored = load();
if (!restored) {
  const nav = (navigator.language || '').toLowerCase();
  if (nav.startsWith('he') || nav.startsWith('iw')) lang = 'he';
}
applyStatic();
if (!restored) markPreset(0);
recalc();
let startTab = (location.hash || '').slice(1);
if (!startTab) { try { startTab = sessionStorage.getItem(STORE + '-tab') || ''; } catch (e) {} }
showTab(startTab || 'formula');
initRecipes();
})();
</script>

</body>
